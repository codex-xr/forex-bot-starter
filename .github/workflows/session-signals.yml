name: Forex Session Signals

on:
  workflow_dispatch:
    inputs:
      session:
        description: "Market session to scan"
        required: true
        default: "london"
        type: choice
        options:
          - tokyo
          - london
          - new_york
          - overlap

  schedule:
    - cron: "0 0 * * 1-5"
    - cron: "0 8 * * 1-5"
    - cron: "0 13 * * 1-5"
    - cron: "0 14 * * 1-5"

jobs:
  scan:
    runs-on: ubuntu-latest

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bot
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Prepare sample data
        run: |
          cp data/sample_eurusd.csv data/eur_usd.csv

      - name: Choose scheduled session
        id: session
        run: |
          hour="$(date -u +%H)"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "session=${{ inputs.session }}" >> "$GITHUB_OUTPUT"
          elif [ "$hour" = "00" ]; then
            echo "session=tokyo" >> "$GITHUB_OUTPUT"
          elif [ "$hour" = "08" ]; then
            echo "session=london" >> "$GITHUB_OUTPUT"
          elif [ "$hour" = "13" ]; then
            echo "session=new_york" >> "$GITHUB_OUTPUT"
          else
            echo "session=overlap" >> "$GITHUB_OUTPUT"
          fi

      - name: Send session signal
        run: |
          python -m bot.session_bot --session "${{ steps.session.outputs.session }}"
