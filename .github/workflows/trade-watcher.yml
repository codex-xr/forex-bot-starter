name: 24/7 Trade Monitor & Auto-Pilot Live Calls

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  watch_trades:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger 24/7 Trade Monitor & Auto-Pilot Live Calls on Vercel
        run: |
          curl -sS --max-time 55 "https://forex-bot-starter-codex.vercel.app/api/cron" || true
